[package]
name = "remarkable-screenshare"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "reMarkable screen share: RFB v2 protocol, WebRTC transport and frame session"
keywords = ["remarkable", "screenshare", "webrtc", "rfb"]

[[bin]]
name = "screenshare"
path = "src/bin/screenshare.rs"
required-features = ["app"]

[features]
default = []
# MQTT client that negotiates through a remarkable-server broker.
cloud = ["dep:rumqttc", "dep:remarkable-mqtt", "dep:uuid"]
# The `screenshare` binary: browser viewer, USB capture, recording.
app = ["cloud", "dep:axum", "dep:tower-http", "dep:futures", "dep:image", "dep:serde_json", "dep:clap", "dep:tracing-subscriber"]

[dependencies]
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
bytes = "1"
flate2 = "1.1"

# WebRTC. Fork adds SettingEngine::set_sctp_max_message_size_can_receive, which
# the tablet's >64 KiB frames need; switch back to crates.io once
# https://github.com/webrtc-rs/webrtc/pull/908 is released.
webrtc = { git = "https://github.com/coleleavitt/webrtc", branch = "fix/datachannel-max-message-size" }

# cloud
remarkable-mqtt = { workspace = true, optional = true }
rumqttc = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

# app
axum = { version = "0.7", features = ["ws"], optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
futures = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
serde_json = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
